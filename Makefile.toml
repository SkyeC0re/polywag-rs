[tasks.format]
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--", "--emit=files"]

[tasks.clean]
command = "cargo"
args = ["clean"]

[tasks.build]
command = "cargo"
args = ["build"]
dependencies = ["clean"]

[tasks.test]
command = "cargo"
args = ["test", "${@}"]

[tasks.test-miri]
toolchain = "nightly"
command = "cargo"
args = ["miri", "test", "${@}"]

[tasks.docs-katex]
env = { "RUSTDOCFLAGS" = "--html-in-header katex-header.html" }
command = "cargo"
args = ["doc", "--no-deps"]

[tasks.readme]
command = "cargo"
args = ["readme", "-o", "README.md"]
